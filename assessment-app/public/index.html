<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0c18">
  <title>She's Next College Finder AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5l-2.2-6.3L3.5 10l6.3-1.7z" fill="currentColor"/><circle cx="19" cy="18" r="2.2" fill="currentColor" opacity=".7"/></svg></span>
      <span class="brand-name">She's Next <b>College Finder</b></span>
      <span class="ai">AI</span>
    </div>
    <span class="beta">Beta</span>
  </header>

  <div class="layout">
    <aside class="panel side" id="side" aria-label="Her profile">
      <div class="side-head">
        <h1>Find college programs <span class="grad">worth her time.</span></h1>
        <p class="muted">Three answers to start. Results update as you go.</p>
      </div>
      <form id="form" novalidate>
        <div class="field">
          <label class="lbl">Grade</label>
          <div class="seg" data-key="grade" data-single role="radiogroup" aria-label="Grade"></div>
        </div>
        <div class="field">
          <label class="lbl">Position <span class="hint">pick all she plays</span></label>
          <div class="chips" data-key="positions" aria-label="Position"></div>
        </div>
        <div class="field">
          <label class="lbl" for="zip">Home ZIP</label>
          <div class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9.5" r="2.5" fill="currentColor"/></svg>
            <input id="zip" inputmode="numeric" maxlength="5" autocomplete="postal-code" placeholder="e.g. 63101">
          </div>
          <div class="chips small" data-key="radius" data-single aria-label="Distance from home"></div>
        </div>

        <details class="more" id="more">
          <summary><span>Add detail for sharper results</span><span class="count" id="moreCount">0 of 4</span></summary>
          <div class="field">
            <label class="lbl">Height</label>
            <div class="stepper" id="heightBox">
              <button type="button" class="ib" id="hMinus" aria-label="Shorter">−</button>
              <output id="hOut">Add</output>
              <button type="button" class="ib" id="hPlus" aria-label="Taller">+</button>
              <button type="button" class="link" id="hClear" hidden>Clear</button>
            </div>
          </div>
          <div class="field">
            <label class="lbl">GPA</label>
            <div class="chips small" data-key="gpa" data-single aria-label="GPA"></div>
          </div>
          <div class="field">
            <label class="lbl">Where she plays</label>
            <div class="chips small" data-key="playing" aria-label="Where she plays"></div>
          </div>
          <div class="field">
            <label class="lbl">Recruiting interest so far</label>
            <div class="chips small" data-key="interest" aria-label="Recruiting interest"></div>
            <div class="sub" id="levelsWrap" hidden>
              <span class="hint">From which levels?</span>
              <div class="chips small" data-key="interestLevels" aria-label="Levels showing interest"></div>
            </div>
          </div>
        </details>
      </form>
      <p class="privacy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z" fill="none" stroke="currentColor" stroke-width="2"/></svg>No account, email or phone. Answers stay in your browser.</p>
    </aside>

    <main class="main" id="main" aria-live="polite"></main>
  </div>
  <button type="button" class="jump" id="jump" hidden>See her results <span aria-hidden="true">↓</span></button>
  <script type="module" src="/app.js"></script>
</body>
</html>
